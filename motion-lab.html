<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motion lab — ambient concepts</title>
<style>
  body { margin: 0; padding: 28px 24px 60px; background: #f9f6f2; color: #2b2722;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 36px 0 12px; }
  p.note { font-size: 13px; color: #8a857c; margin: 0 0 18px; max-width: 720px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
  .card { background: #ffffff; border: 1px solid rgba(9,15,21,.08); border-radius: 10px; padding: 14px 16px 16px; }
  .card h3 { font-size: 13.5px; margin: 0 0 2px; }
  .card .src { font-size: 11.5px; color: #999488; margin: 0 0 12px; }
  .demo { position: relative; height: 190px; border-radius: 8px; overflow: hidden; background: #f6f1e8; }

  /* ===== 1 suit dust ===== */
  .dust span { position: absolute; bottom: -30px; animation: rise linear infinite; }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 12% { opacity: 1; }
    82% { opacity: 1; } 100% { transform: translateY(-230px); opacity: 0; } }

  /* ===== 2 suit blobs under grain ===== */
  .blobs .suitblob { position: absolute; font-weight: bold; will-change: transform;
    text-shadow: 0 2px 0 rgba(255,255,255,.55);
    animation: sfloat ease-in-out infinite alternate; }
  @keyframes sfloat { from { transform: translate(0, 0) rotate(-6deg); }
    to { transform: translate(var(--dx, 30px), var(--dy, -22px)) rotate(7deg); } }
  .grain { position: absolute; inset: 0; background: url(noise.png); background-size: 256px;
    mix-blend-mode: overlay; opacity: .5; image-rendering: pixelated; pointer-events: none; }

  /* ===== 5 felt lamp ===== */
  .felt { background: url(green-felt.jpg) center/cover; }
  .lamp2 { position: absolute; left: -240px; top: -190px; width: 480px; height: 380px;
    background: radial-gradient(closest-side, rgba(255,252,214,.34), transparent 72%);
    pointer-events: none; will-change: transform; }
  .vig { position: absolute; inset: 0; box-shadow: inset 0 0 60px 18px rgba(0,20,8,.35); pointer-events: none; }

  /* ===== 6 chatter ticker ===== */
  .chatter { display: flex; align-items: center; height: 100%; }
  .chatbelt { white-space: nowrap; font-size: 14.5px; color: #7d776c; animation: belt 26s linear infinite; }
  @keyframes belt { to { transform: translateX(-50%); } }
  .chatbelt b { color: #4c473f; font-weight: 600; }
  .chatbelt .cdot { color: #c9c2b4; margin: 0 14px; }

  /* ===== 7 deal-ins ===== */
  .dealins .toastcard { position: absolute; right: 14px; top: 22px; display: flex; align-items: center; gap: 9px;
    background: #fff; border: 1px solid rgba(0,0,0,.09); border-radius: 9px; padding: 9px 13px;
    font-size: 13px; color: #4c473f; box-shadow: 0 4px 14px rgba(60,45,25,.13); }
  .dealins .toastcard img { width: 26px; height: 26px; }
  .dealins .cornercard { position: absolute; width: 34px; height: 48px; background: #fff; border-radius: 4px;
    border: 1px solid rgba(0,0,0,.14); display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: bold; }


  /* ===== 8 word in cards ===== */
  .wordcards { display: flex; align-items: flex-end; justify-content: center; gap: 10px; background: #f9f6f2; padding-bottom: 46px; }
  .wordcards .lslot { animation: lbreathe 5s ease-in-out infinite alternate; }
  @keyframes lbreathe { from { transform: rotate(-1.6deg) translateY(0); } to { transform: rotate(1.6deg) translateY(-2px); } }
  .wordcards .lcard { width: 46px; height: 64px; background: #fff; border-radius: 6px; border: 1px solid rgba(43,39,34,.12);
    box-shadow: 0 2px 6px rgba(60,45,25,.12); display: grid; place-items: center; position: relative;
    font-weight: bold; font-size: 24px; opacity: 0; will-change: transform, opacity; transition: transform .25s, box-shadow .25s; }
  .wordcards .lslot:hover .lcard { transform: translateY(-6px); box-shadow: 0 8px 16px rgba(60,45,25,.18); }
  .wordcards .lcard i { position: absolute; font-size: 9px; font-style: normal; }
  .wordcards .lcard i.tl { top: 3px; left: 5px; }
  .wordcards .lcard i.br { bottom: 3px; right: 5px; transform: rotate(180deg); }

  /* ===== 9 dealt headline ===== */
  .hline { display: flex; align-items: center; justify-content: center; background: #f9f6f2; }
  .hline .hwrap { text-align: center; font-family: Georgia, "Times New Roman", serif; font-size: 25px; color: #2b2722; line-height: 1.25; }
  .hline .word { display: inline-block; overflow: hidden; vertical-align: bottom; margin: 0 3px; }
  .hline .word > span { display: inline-block; will-change: transform, filter, opacity; transform: translateY(115%); }
  .hline .word.accent > span { color: #E2795F; font-style: italic; }

  /* ===== 10 suit morph ===== */
  .morph { display: grid; place-items: center; background: #f9f6f2; }
  .morph span { grid-area: 1 / 1; font-size: 76px; line-height: 1; will-change: transform, filter, opacity; opacity: 0; }

  /* ===== 11 constellation ===== */
  .consta { background: #f9f6f2; }
  .consta .cnode { position: absolute; width: 5px; height: 5px; border-radius: 50%;
    animation: sfloat ease-in-out infinite alternate; }
  .consta .cring { position: absolute; width: 5px; height: 5px; border-radius: 50%; pointer-events: none; }
  .consta svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .consta line { stroke: rgba(43,39,34,.25); stroke-width: 1; }

  /* ===== 12 sorting hand ===== */
  .sorthand { background: #f9f6f2; }
  .sorthand .hcard { position: absolute; bottom: 24px; width: 32px; height: 44px; background: #fff;
    border: 1px solid rgba(43,39,34,.14); border-radius: 4px; box-shadow: 0 1px 3px rgba(60,45,25,.14);
    display: grid; place-items: center; font-size: 11.5px; font-weight: bold; will-change: transform; }

  /* ===== 13 ink blooms ===== */
  .ink { background: #f9f6f2; }
  .ink span { position: absolute; opacity: 0; will-change: transform, opacity, filter; }

  /* ===== 14 pip meadow ===== */
  .pipfield { background: #f9f6f2; }
  .pipfield span { position: absolute; font-size: 11px; will-change: transform; }

  /* ===== 15 window weather ===== */
  .wsky .sk { position: absolute; inset: 0; }
  .wsky .sk1 { background: linear-gradient(#cfe3f2, #f4ead8); animation: skyday 36s linear infinite; }
  .wsky .sk2 { background: linear-gradient(#f0c9a0, #e8a58a); opacity: 0; animation: skydusk 36s linear infinite; }
  .wsky .sk3 { background: linear-gradient(#39406b, #6a5a74); opacity: 0; animation: skynight 36s linear infinite; }
  @keyframes skyday { 0%, 24% { opacity: 1; } 36%, 88% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes skydusk { 0%, 24% { opacity: 0; } 34%, 52% { opacity: 1; } 64%, 100% { opacity: 0; } }
  @keyframes skynight { 0%, 56% { opacity: 0; } 68%, 86% { opacity: 1; } 98%, 100% { opacity: 0; } }
  .wsky .sun { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #E8A03E;
    box-shadow: 0 0 14px 3px rgba(232,160,62,.5); animation: sunarc 36s linear infinite; }
  @keyframes sunarc { 0% { transform: translate(-20px, 120px); opacity: 1; }
    15% { transform: translate(150px, 26px); opacity: 1; } 30% { transform: translate(330px, 110px); opacity: 1; }
    32%, 100% { transform: translate(330px, 140px); opacity: 0; } }
  .wsky .moon { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #f4efe2;
    box-shadow: 0 0 10px 2px rgba(244,239,226,.4); opacity: 0; animation: moonarc 36s linear infinite; }
  @keyframes moonarc { 0%, 58% { transform: translate(-20px, 110px); opacity: 0; }
    64% { transform: translate(80px, 40px); opacity: 1; } 84% { transform: translate(240px, 26px); opacity: 1; }
    92%, 100% { transform: translate(320px, 90px); opacity: 0; } }
  .wsky .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #f4efe2;
    opacity: 0; animation: starp 36s linear infinite; }
  @keyframes starp { 0%, 60% { opacity: 0; } 68%, 84% { opacity: .9; } 92%, 100% { opacity: 0; } }
  .wsky .lampglow { position: absolute; right: -40px; bottom: -50px; width: 200px; height: 160px;
    background: radial-gradient(closest-side, rgba(232,160,62,.5), transparent 70%); opacity: 0; animation: lampup 36s linear infinite; }
  @keyframes lampup { 0%, 58% { opacity: 0; } 70%, 86% { opacity: 1; } 96%, 100% { opacity: 0; } }
  .wsky .frame { position: absolute; inset: 0; border: 11px solid #f1e8d6; border-radius: 8px; pointer-events: none; }
  .wsky .bar { position: absolute; top: 0; bottom: 0; left: 50%; width: 9px; margin-left: -4.5px; background: #f1e8d6; }

  /* ===== 16 tally doodles ===== */
  .tally { background: #f9f6f2; display: grid; place-items: center; }
  .tally path, .tally line { stroke: #6b655c; stroke-width: 2.5; stroke-linecap: round; fill: none; }

  /* ===== 17 seat lights ===== */
  .seats { background: #f9f6f2; display: grid; place-items: center; }
  .seats .tbl { position: relative; width: 150px; height: 88px; border: 2px solid rgba(43,39,34,.18); border-radius: 26px; }
  .seats .seat { position: absolute; width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid rgba(43,39,34,.25); background: #f9f6f2;
    transition: background .5s, border-color .5s, box-shadow .5s; }
  .seats .seat.on { background: #7FA06A; border-color: #7FA06A; box-shadow: 0 0 10px 2px rgba(127,160,106,.45); }
  .seats .slabel { position: absolute; font-size: 10.5px; color: #8a857c; opacity: 0; transition: opacity .5s; white-space: nowrap; }

</style>
</head>
<body>

<h1>Motion lab</h1>
<p class="note">The ElevenLabs orb works because the motion is made of the product itself (the artwork's own colors, stirred).
The WOCG equivalent is not abstract fluid; it is the quiet motion of a card room: cards, felt, suits, table talk.
Every card below explores that.</p>

<h2>Ambient concepts</h2>
<div class="grid" id="ambient"></div>


<script>
  // ---------- helpers ----------
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function card(parent, title, desc) {
    var c = el("div", "card", "<h3>" + title + "</h3><p class='src'>" + desc + "</p>");
    parent.appendChild(c);
    return c;
  }

  var ambient = document.getElementById("ambient");

  // 1 — suit dust
  (function () {
    var c = card(ambient, "Floating suit dust", "Faint suits drift up the hero background like dust in lamplight. Barely there.");
    var d = el("div", "demo dust");
    var suits = ["♠", "♥", "♦", "♣"];
    for (var i = 0; i < 14; i++) {
      var s = el("span", "", suits[i % 4]);
      var red = i % 4 === 1 || i % 4 === 2;
      s.style.cssText = "left:" + (4 + (i * 7.1) % 92) + "%;font-size:" + (13 + (i * 5) % 18) + "px;" +
        "color:" + (red ? "rgba(192,57,43,.09)" : "rgba(43,39,34,.08)") + ";" +
        "animation-duration:" + (14 + (i * 3) % 15) + "s;animation-delay:-" + (i * 2.3) + "s;";
      d.appendChild(s);
    }
    c.appendChild(d);
  })();

  // 2 — suit blobs under grain
  (function () {
    var c = card(ambient, "Floating suit blobs", "Suits in the room's warm dusty colors bob like balloons: big soft ones far back, small crisp ones up front. Cozy, not spooky.");
    var d = el("div", "demo blobs");
    var defs = [
      ["♥", "#E2795F", 92, 3.5, "6%", "32%", 34, -20, 11],
      ["♠", "#7FA06A", 62, 2.5, "33%", "10%", -26, 26, 9],
      ["♦", "#E8A03E", 44, 1.5, "57%", "54%", 30, -24, 8],
      ["♣", "#8FA6B8", 76, 3, "72%", "22%", -32, 20, 10],
      ["♥", "#D98C8C", 32, 1, "44%", "68%", 24, -16, 7],
      ["♦", "#E8B45F", 26, .8, "19%", "64%", -20, -18, 7.5]
    ];
    defs.forEach(function (b, i) {
      var s = el("span", "suitblob", b[0]);
      s.style.cssText = "color:" + b[1] + ";font-size:" + b[2] + "px;filter:blur(" + b[3] + "px);opacity:.75;" +
        "left:" + b[4] + ";top:" + b[5] + ";--dx:" + b[6] + "px;--dy:" + b[7] + "px;" +
        "animation-duration:" + b[8] + "s;animation-delay:-" + (i * 2.9) + "s;";
      d.appendChild(s);
    });
    d.appendChild(el("div", "grain"));
    c.appendChild(d);
  })();

  // 5 — felt lamp (follows the mouse)
  (function () {
    var c = card(ambient, "Lamplight on felt", "A warm light drifts over the felt and leans toward your cursor. Move the mouse across it.");
    var d = el("div", "demo felt");
    var lamp = el("div", "lamp2");
    d.appendChild(lamp);
    d.appendChild(el("div", "vig"));
    c.appendChild(d);
    var mx = null, my = null, x = 180, y = 90;
    d.addEventListener("mousemove", function (e) {
      var r = d.getBoundingClientRect();
      mx = e.clientX - r.left;
      my = e.clientY - r.top;
    });
    d.addEventListener("mouseleave", function () { mx = my = null; });
    (function loop(ts) {
      var tx, ty;
      if (mx !== null) { tx = mx; ty = my; }
      else {
        tx = d.clientWidth / 2 + Math.sin(ts / 2600) * d.clientWidth * .3;
        ty = d.clientHeight * .45 + Math.cos(ts / 3400) * 24;
      }
      x += (tx - x) * .06;
      y += (ty - y) * .06;
      lamp.style.transform = "translate(" + x + "px," + y + "px)";
      requestAnimationFrame(loop);
    })(0);
  })();

  // 6 — table chatter
  (function () {
    var c = card(ambient, "Table-chatter ticker", "Real (pre-moderated) table talk drifts by. The sound of the room, visualized.");
    var d = el("div", "demo chatter");
    var quotes = ["<b>Marge:</b> nice hand!", "<b>BobK:</b> one more?", "<b>Vera:</b> gg everyone",
      "<b>Duckling:</b> lucky ace…", "<b>Hank:</b> well played", "<b>Rosie:</b> again tomorrow?"];
    var belt = quotes.join("<span class='cdot'>·</span>");
    d.appendChild(el("div", "chatbelt", belt + "<span class='cdot'>·</span>" + belt));
    c.appendChild(d);
  })();

  // 7 — activity deal-ins
  (function () {
    var c = card(ambient, "Activity deal-ins", "Live events dealt onto the page as little cards, not toasts. Proof the room is alive.");
    var d = el("div", "demo dealins");
    c.appendChild(d);
    var events = [
      ["AnimalCat.svg", "<b>Duckling</b> joined table Rose42"],
      ["AnimalFox.svg", "<b>BobK</b> opened a Euchre table"],
      ["AnimalGopher.svg", "<b>Marge</b> won a Hearts hand"],
      ["AnimalChicken.svg", "<b>Vera</b> is one seat short"]
    ];
    var n = 0, cur = null;
    function spawn() {
      var ev = events[n++ % events.length];
      var t = el("div", "toastcard", "<img src='" + ev[0] + "' alt=''><span>" + ev[1] + "</span>");
      d.appendChild(t);
      t.animate([
        { transform: "translateX(120%) rotate(4deg)", opacity: 0 },
        { transform: "translateX(0) rotate(0deg)", opacity: 1 }
      ], { duration: 480, easing: "cubic-bezier(.2,.9,.3,1)" });
      if (cur) (function (old) {
        old.animate([{ opacity: 1, transform: "translateY(0)" }, { opacity: 0, transform: "translateY(26px)" }],
          { duration: 420, fill: "forwards" }).onfinish = function () { old.remove(); };
      })(cur);
      cur = t;
    }
    spawn();
    setInterval(spawn, 5200);
  })();




  // 8 — the word in cards (from Holger's notes: "cards" spelled with playing cards)
  (function () {
    var c = card(ambient, "The word in cards", "CARDS spelled with actual little playing cards. They deal themselves in, breathe while they wait, and lift when you greet them.");
    var d = el("div", "demo wordcards");
    var defs = [["C", "♥", "#c0392b"], ["A", "♠", "#2b2722"], ["R", "♦", "#c0392b"], ["D", "♣", "#2b2722"], ["S", "♥", "#c0392b"]];
    var cards2 = defs.map(function (df, i) {
      var slot = el("div", "lslot");
      slot.style.animationDelay = (-i * 1.15) + "s";
      var lc = el("div", "lcard");
      lc.style.color = df[2];
      lc.innerHTML = df[0] + "<i class='tl'>" + df[1] + "</i><i class='br'>" + df[1] + "</i>";
      slot.appendChild(lc);
      d.appendChild(slot);
      return lc;
    });
    c.appendChild(d);
    function deal() {
      cards2.forEach(function (lc, i) {
        var a = lc.animate([
          { opacity: 0, transform: "translateY(26px) rotate(5deg)" },
          { opacity: 1, transform: "translateY(0) rotate(0deg)" }
        ], { duration: 550, delay: 400 + i * 160, easing: "cubic-bezier(.2,.8,.25,1)", fill: "backwards" });
        a.onfinish = function () { lc.style.opacity = 1; a.cancel(); };
      });
    }
    deal();
    setInterval(function () {
      cards2.forEach(function (lc, i) {
        var a = lc.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, delay: i * 60, fill: "forwards" });
        a.onfinish = function () { lc.style.opacity = 0; a.cancel(); };
      });
      setTimeout(deal, 900);
    }, 16000);
  })();

  // 9 — dealt headline
  (function () {
    var c = card(ambient, "The dealt headline", "The hero line enters word by word, rising out of its own baseline like cards laid on a table. Then it clears and deals again.");
    var d = el("div", "demo hline");
    var wrap = el("div", "hwrap");
    var words = ["Play", "cards", "in", "good", "company."];
    var spans = words.map(function (w, i) {
      var wd = el("span", "word" + (i >= 3 ? " accent" : ""));
      var inner = el("span", "", w);
      wd.appendChild(inner);
      wrap.appendChild(wd);
      return inner;
    });
    d.appendChild(wrap);
    c.appendChild(d);
    function enter() {
      spans.forEach(function (s, i) {
        var a = s.animate([
          { transform: "translateY(115%)", filter: "blur(5px)" },
          { transform: "translateY(0)", filter: "blur(0px)" }
        ], { duration: 620, delay: i * 110, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" });
        a.onfinish = function () { s.style.transform = "translateY(0)"; a.cancel(); };
      });
    }
    function exit() {
      spans.forEach(function (s, i) {
        var a = s.animate([
          { transform: "translateY(0)", opacity: 1 },
          { transform: "translateY(-115%)", opacity: .4 }
        ], { duration: 420, delay: i * 60, easing: "ease-in", fill: "forwards" });
        a.onfinish = function () { s.style.transform = "translateY(115%)"; a.cancel(); };
      });
    }
    enter();
    setInterval(function () { exit(); setTimeout(enter, 800); }, 9000);
  })();

  // 10 — suit morph
  (function () {
    var c = card(ambient, "Suit morph", "One mark of the house, slowly becoming the next: spade to heart to diamond to club, dissolving through a soft blur.");
    var d = el("div", "demo morph");
    var A = el("span"), B = el("span");
    d.appendChild(A); d.appendChild(B);
    c.appendChild(d);
    var suits = ["♠", "♥", "♦", "♣"];
    var colors = ["#2b2722", "#E2795F", "#E8A03E", "#7FA06A"];
    var idx = 0, cur = A, nxt = B;
    cur.textContent = suits[0]; cur.style.color = colors[0]; cur.style.opacity = .85;
    setInterval(function () {
      idx = (idx + 1) % 4;
      nxt.textContent = suits[idx];
      nxt.style.color = colors[idx];
      cur.animate([
        { opacity: .85, filter: "blur(0px)", transform: "scale(1)" },
        { opacity: 0, filter: "blur(12px)", transform: "scale(1.18)" }
      ], { duration: 1300, easing: "ease-in", fill: "forwards" });
      nxt.animate([
        { opacity: 0, filter: "blur(12px)", transform: "scale(.84)" },
        { opacity: .85, filter: "blur(0px)", transform: "scale(1)" }
      ], { duration: 1300, easing: "ease-out", fill: "forwards" });
      var t = cur; cur = nxt; nxt = t;
    }, 3600);
  })();

  // 11 — constellation of tables
  (function () {
    var c = card(ambient, "Constellation of tables", "Every dot is a live table drifting in the room. One pings now and then, and sometimes a thread draws two of them together.");
    var d = el("div", "demo consta");
    var palette = ["#7FA06A", "#E2795F", "#E8A03E", "#8FA6B8"];
    var nodes = [];
    for (var i = 0; i < 12; i++) {
      var n = el("span", "cnode");
      var x = 24 + (i * 61) % 320, y = 20 + (i * 43) % 150;
      n.style.cssText = "left:" + x + "px;top:" + y + "px;background:" + palette[i % 4] + ";" +
        "--dx:" + (8 - (i % 4) * 5) + "px;--dy:" + ((i % 3) * 5 - 5) + "px;animation-duration:" + (7 + i) + "s;animation-delay:-" + i * 1.7 + "s;";
      d.appendChild(n);
      nodes.push({ el: n, x: x, y: y, color: palette[i % 4] });
    }
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    var link = document.createElementNS("http://www.w3.org/2000/svg", "line");
    svg.appendChild(link);
    d.appendChild(svg);
    d.appendChild(el("div", "grain"));
    c.appendChild(d);
    setInterval(function () {
      var n = nodes[Math.floor(Math.random() * nodes.length)];
      var ring = el("span", "cring");
      ring.style.cssText = "left:" + n.x + "px;top:" + n.y + "px;background:" + n.color + ";";
      d.appendChild(ring);
      ring.animate([
        { transform: "scale(1)", opacity: .6 },
        { transform: "scale(5)", opacity: 0 }
      ], { duration: 1100, easing: "cubic-bezier(0,0,.2,1)" }).onfinish = function () { ring.remove(); };
    }, 1900);
    setInterval(function () {
      var a = nodes[Math.floor(Math.random() * nodes.length)], b;
      do { b = nodes[Math.floor(Math.random() * nodes.length)]; } while (b === a);
      link.setAttribute("x1", a.x + 2.5); link.setAttribute("y1", a.y + 2.5);
      link.setAttribute("x2", b.x + 2.5); link.setAttribute("y2", b.y + 2.5);
      var len = Math.hypot(b.x - a.x, b.y - a.y);
      link.style.strokeDasharray = len;
      link.animate([
        { strokeDashoffset: len, opacity: 1 },
        { strokeDashoffset: 0, opacity: 1, offset: .35 },
        { strokeDashoffset: 0, opacity: 1, offset: .75 },
        { strokeDashoffset: 0, opacity: 0 }
      ], { duration: 3200, easing: "ease-out" });
    }, 6400);
  })();

  // 12 — the sorting hand
  (function () {
    var c = card(ambient, "The sorting hand", "Seven cards rest at the edge of the table, and every few seconds a neighborly pair trades places, like someone tidying a hand mid-game.");
    var d = el("div", "demo sorthand");
    var ranks = ["A♠", "3♥", "7♦", "J♣", "9♥", "Q♠", "5♦"];
    var cards3 = ranks.map(function (r, i) {
      var hc = el("div", "hcard", r);
      hc.style.color = (r.indexOf("♥") > -1 || r.indexOf("♦") > -1) ? "#c0392b" : "#2b2722";
      hc.style.left = (78 + i * 30) + "px";
      hc.style.zIndex = i;
      d.appendChild(hc);
      return { el: hc, x: 78 + i * 30 };
    });
    c.appendChild(d);
    setInterval(function () {
      var i = Math.floor(Math.random() * 6);
      var a = cards3[i], b = cards3[i + 1];
      var dx = b.x - a.x;
      a.el.style.zIndex = 10;
      var aa = a.el.animate([
        { transform: "translate(0,0)" },
        { transform: "translate(" + dx / 2 + "px,-14px)" },
        { transform: "translate(" + dx + "px,0)" }
      ], { duration: 650, easing: "ease-in-out", fill: "forwards" });
      var ba = b.el.animate([
        { transform: "translate(0,0)" },
        { transform: "translate(" + (-dx) + "px,0)" }
      ], { duration: 650, easing: "ease-in-out", fill: "forwards" });
      aa.onfinish = function () {
        var t = a.x; a.x = b.x; b.x = t;
        a.el.style.left = a.x + "px"; b.el.style.left = b.x + "px";
        a.el.style.zIndex = 5; b.el.style.zIndex = 4;
        aa.cancel(); ba.cancel();
        cards3[i] = b; cards3[i + 1] = a;
      };
    }, 4200);
  })();

  // 13 — ink blooms
  (function () {
    var c = card(ambient, "Ink blooms", "Suits bloom like drops of ink in water: a soft mark appears, spreads, and is gone. The page never stops being paper.");
    var d = el("div", "demo ink");
    var pool = [];
    for (var i = 0; i < 6; i++) { var s = el("span"); d.appendChild(s); pool.push(s); }
    c.appendChild(d);
    var suits = ["♠", "♥", "♦", "♣"];
    var colors = ["#8FA6B8", "#E2795F", "#E8A03E", "#7FA06A"];
    var pi = 0;
    setInterval(function () {
      var s = pool[pi++ % 6];
      var k = Math.floor(Math.random() * 4);
      s.textContent = suits[k];
      s.style.color = colors[k];
      s.style.fontSize = (26 + Math.random() * 30) + "px";
      s.style.left = (20 + Math.random() * 300) + "px";
      s.style.top = (10 + Math.random() * 130) + "px";
      s.animate([
        { opacity: 0, filter: "blur(1px)", transform: "scale(.6)" },
        { opacity: .4, offset: .25 },
        { opacity: 0, filter: "blur(16px)", transform: "scale(1.7)" }
      ], { duration: 6000, easing: "ease-out" });
    }, 2600);
  })();

  // 14 — pip meadow
  (function () {
    var c = card(ambient, "Pip meadow", "A field of tiny pips parts around your cursor like tall grass and springs softly back when you pass.");
    var d = el("div", "demo pipfield");
    var suits = "♠♥♦♣";
    var pips = [];
    for (var r = 0; r < 5; r++) {
      for (var col = 0; col < 12; col++) {
        var s = el("span", "", suits[(r + col) % 4]);
        var red = (r + col) % 4 === 1 || (r + col) % 4 === 2;
        var hx = 16 + col * 29, hy = 18 + r * 36;
        s.style.cssText = "left:" + hx + "px;top:" + hy + "px;color:" +
          (red ? "rgba(192,57,43,.22)" : "rgba(43,39,34,.18)") + ";";
        d.appendChild(s);
        pips.push({ el: s, hx: hx, hy: hy, ox: 0, oy: 0, vx: 0, vy: 0 });
      }
    }
    c.appendChild(d);
    var mx = -999, my = -999;
    d.addEventListener("mousemove", function (e) {
      var r2 = d.getBoundingClientRect();
      mx = e.clientX - r2.left; my = e.clientY - r2.top;
    });
    d.addEventListener("mouseleave", function () { mx = my = -999; });
    (function loop() {
      pips.forEach(function (p) {
        var dx = p.hx + 5 - mx, dy = p.hy + 7 - my;
        var dist = Math.hypot(dx, dy);
        var tx = 0, ty = 0;
        if (dist < 70 && dist > 0) {
          var push = (70 - dist) * .38;
          tx = dx / dist * push; ty = dy / dist * push;
        }
        p.vx += (tx - p.ox) * .14; p.vy += (ty - p.oy) * .14;
        p.vx *= .78; p.vy *= .78;
        p.ox += p.vx; p.oy += p.vy;
        p.el.style.transform = "translate(" + p.ox.toFixed(1) + "px," + p.oy.toFixed(1) + "px)";
      });
      requestAnimationFrame(loop);
    })();
  })();

  // 15 — window weather
  (function () {
    var c = card(ambient, "Window weather", "The window behind the table runs a whole day in half a minute: morning sky, golden dusk, starry night, and a lamp that switches itself on.");
    var d = el("div", "demo wsky");
    d.appendChild(el("div", "sk sk1"));
    d.appendChild(el("div", "sk sk2"));
    d.appendChild(el("div", "sk sk3"));
    var sun = el("div", "sun"); d.appendChild(sun);
    var moon = el("div", "moon"); d.appendChild(moon);
    [[60, 40], [150, 26], [250, 52]].forEach(function (p, i) {
      var st = el("div", "star");
      st.style.left = p[0] + "px"; st.style.top = p[1] + "px";
      st.style.animationDelay = (i * .4) + "s";
      d.appendChild(st);
    });
    d.appendChild(el("div", "lampglow"));
    d.appendChild(el("div", "bar"));
    d.appendChild(el("div", "frame"));
    c.appendChild(d);
  })();

  // 16 — tally doodles
  (function () {
    var c = card(ambient, "Tally doodles", "Someone keeps score in pencil: tally strokes draw themselves, a little heart for the winner, then the page wipes clean.");
    var d = el("div", "demo tally");
    var NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 260 130");
    svg.setAttribute("width", "260"); svg.setAttribute("height", "130");
    var defs = [
      "M30 30 L31 74", "M46 28 L45 73", "M62 31 L62 75", "M78 29 L77 74", "M20 66 L88 38",
      "M120 30 L121 74", "M136 28 L135 73", "M152 31 L152 75",
      "M196 52 C190 40 172 44 174 57 C176 68 188 72 197 82 C206 72 218 68 220 57 C222 44 203 40 197 52 Z"
    ];
    var paths = defs.map(function (dd) {
      var p = document.createElementNS(NS, "path");
      p.setAttribute("d", dd);
      svg.appendChild(p);
      return p;
    });
    d.appendChild(svg);
    c.appendChild(d);
    function run() {
      var t = 300;
      paths.forEach(function (p, i) {
        var len = p.getTotalLength();
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
        p.style.opacity = 1;
        var dur = i === paths.length - 1 ? 800 : 260;
        setTimeout(function () {
          var a = p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: dur, easing: "ease-out", fill: "forwards" });
          a.onfinish = function () { p.style.strokeDashoffset = 0; a.cancel(); };
        }, t);
        t += dur + 140;
      });
      setTimeout(function () {
        var a = svg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: "forwards" });
        a.onfinish = function () {
          paths.forEach(function (p) { p.style.opacity = 0; });
          svg.style.opacity = 1;
          a.cancel();
          setTimeout(run, 700);
        };
      }, t + 1900);
    }
    run();
  })();

  // 17 — seat lights
  (function () {
    var c = card(ambient, "Seat lights", "An empty table outline fills seat by seat as players arrive, glows warmly for a moment when it is full, and resets for the next round.");
    var d = el("div", "demo seats");
    var tbl = el("div", "tbl");
    var seats = [
      ["left:50%;top:-18px;margin-left:-6px;", "Marge", "left:50%;top:-40px;transform:translateX(-50%);"],
      ["right:-18px;top:50%;margin-top:-6px;", "BobK", "right:-58px;top:44%;"],
      ["left:50%;bottom:-18px;margin-left:-6px;", "Vera", "left:50%;bottom:-40px;transform:translateX(-50%);"],
      ["left:-18px;top:50%;margin-top:-6px;", "Hank", "left:-56px;top:44%;"]
    ].map(function (sd) {
      var s = el("div", "seat");
      s.style.cssText = sd[0];
      var lb = el("div", "slabel", sd[1]);
      lb.style.cssText = sd[2];
      tbl.appendChild(s); tbl.appendChild(lb);
      return { seat: s, label: lb };
    });
    d.appendChild(tbl);
    c.appendChild(d);
    (function cycle() {
      seats.forEach(function (s, i) {
        setTimeout(function () {
          s.seat.classList.add("on");
          s.label.style.opacity = 1;
          if (i === 3) {
            tbl.animate([
              { borderColor: "rgba(43,39,34,.18)", boxShadow: "0 0 0 0 rgba(232,160,62,0)" },
              { borderColor: "#E8A03E", boxShadow: "0 0 22px 4px rgba(232,160,62,.35)", offset: .35 },
              { borderColor: "rgba(43,39,34,.18)", boxShadow: "0 0 0 0 rgba(232,160,62,0)" }
            ], { duration: 1600, easing: "ease-in-out" });
          }
        }, 900 + i * 1600);
      });
      setTimeout(function () {
        seats.forEach(function (s) { s.seat.classList.remove("on"); s.label.style.opacity = 0; });
        setTimeout(cycle, 1600);
      }, 900 + 4 * 1600 + 2600);
    })();
  })();

</script>
</body>
</html>
