<!DOCTYPE html>
<html lang="en">
<head>
<!-- Generated by icon-lab-parts/build.js from icon-lab-parts/all-page.html. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every icon, old and new</title>
<link rel="stylesheet" href="guide-fonts.css">
<style>
  /* Every icon the redesign draws, in its groups, at the size the site draws it, each state on the paper it
     sits on. z switches the whole page between the colours the site has today and the picked version, and the
     page keeps the choice over a reload; h shows the hover states, which stay hidden at first so the icons sit
     close, and the pointer on a state that has a hover shows the hover in its place. An icon no version
     changes wears a "stays" tag; a state's name is its tooltip. */
  html { background: #F9F6F2; }
  body { margin: 0; padding: 0 24px 48px; color: #262626; font: 15px/21px BuloRounded, Verdana, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; margin: 0 -24px 4px; padding: 12px 24px 10px; background: rgba(249, 246, 242, .94);
    box-shadow: 0 1px 0 #E4DDD0; display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
  h1 { margin: 0; font: 500 24px/30px "GLCA", "Gelica", Georgia, serif; }
  header p { margin: 0; color: #67635c; }
  .switches { margin-left: auto; display: flex; gap: 8px; }
  .switches button { border: 0; border-radius: 16px; padding: 5px 14px; cursor: pointer; font: 700 14px/20px BuloRounded, Verdana, sans-serif;
    background: #E4DDD0; color: #262626; box-shadow: inset 0 0 0 1px #C9C0AE; }
  .switches button span { font-weight: 400; opacity: .7; margin-left: 6px; }
  #mode { background: #5E574B; color: #fff; box-shadow: inset 0 0 0 1px #484136; }
  body.new #mode { background: #43A038; box-shadow: inset 0 0 0 1px #347D2C; }
  body.hovers #hov { background: #fff; }
  h2 { font: 500 19px/24px "GLCA", "Gelica", Georgia, serif; margin: 22px 0 8px; }
  .cards { display: flex; flex-wrap: wrap; gap: 14px 12px; align-items: flex-start; }
  .icon { display: flex; flex-direction: column; gap: 4px; }
  .tiles { display: flex; flex-wrap: wrap; gap: 4px; }
  .ground { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; corner-shape: squircle; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .06); }
  .ground img { display: block; flex: none; }
  .cap { font-size: 11px; line-height: 14px; max-width: 132px; color: #262626; }
  .cap b { display: block; font-weight: 700; }
  .cap code { display: block; font: 10px/13px ui-monospace, Menlo, monospace; color: #67635c; }
  .cap i { display: block; font-style: normal; color: #8F897C; }
  .tag { display: inline-block; margin-top: 2px; padding: 0 6px; border-radius: 8px; background: #EDE6D9; color: #67635c; font-size: 10px; line-height: 15px; }
  img.n { display: none; }
  body.new img.o { display: none; }
  body.new img.n { display: block; }
  body:not(.hovers) .hv { display: none !important; }
  img[data-hk] { cursor: pointer; }
  footer { margin-top: 28px; color: #67635c; max-width: 820px; font-size: 13px; line-height: 19px; }
</style>
</head>
<body>
<script>try { if (localStorage.getItem('iconLabAllNew') === '1') document.body.classList.add('new'); } catch (e) {}</script>
<header>
  <h1>Every icon, old and new</h1>
  <p>At the size the site draws them. Press <b>z</b> to switch between the colours the site has today and <b>/*@@PICK@@*/</b>. /*@@COUNT@@*/</p>
  <div class="switches"><button id="hov" type="button"></button><button id="mode" type="button"></button></div>
</header>
<!--@@GROUPS@@-->
<footer>/*@@FOOTER@@*/</footer>
<script>
(function () {
  'use strict';
  var mode = document.getElementById('mode'), hov = document.getElementById('hov'), body = document.body;
  function show() {
    mode.innerHTML = (body.classList.contains('new') ? 'New colours' : 'Old colours') + '<span>z</span>';
    hov.innerHTML = (body.classList.contains('hovers') ? 'Hover states shown' : 'Hover states hidden') + '<span>h</span>';
  }
  function flip() {
    body.classList.toggle('new');
    try { localStorage.setItem('iconLabAllNew', body.classList.contains('new') ? '1' : '0'); } catch (e) {}
    show();
  }
  // The pointer on a state that has a hover shows that hover's picture in its place, in the colours on show
  function hoverArt(img) {
    var all = document.querySelectorAll('img[data-k="' + img.getAttribute('data-hk') + '"]');
    var want = img.classList.contains('n') ? 'n' : img.classList.contains('o') ? 'o' : (body.classList.contains('new') ? 'n' : 'o');
    for (var i = 0; i < all.length; i++) if (all[i].classList.contains(want)) return all[i];
    for (var j = 0; j < all.length; j++) if (all[j].classList.contains('b')) return all[j];
    return null;
  }
  document.addEventListener('mouseover', function (e) {
    var img = e.target;
    if (!img || img.tagName !== 'IMG' || !img.hasAttribute('data-hk') || img.hasAttribute('data-rest')) return;
    var art = hoverArt(img);
    if (!art) return;
    img.setAttribute('data-rest', img.getAttribute('src'));
    img.setAttribute('src', art.getAttribute('src'));
  });
  document.addEventListener('mouseout', function (e) {
    var img = e.target;
    if (!img || img.tagName !== 'IMG' || !img.hasAttribute('data-rest')) return;
    img.setAttribute('src', img.getAttribute('data-rest'));
    img.removeAttribute('data-rest');
  });
  function hovers() { body.classList.toggle('hovers'); show(); }
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || e.repeat) return;
    if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); flip(); }
    if (e.key === 'h' || e.key === 'H') { e.preventDefault(); hovers(); }
  });
  mode.addEventListener('click', flip);
  hov.addEventListener('click', hovers);
  show();
})();
</script>
</body>
</html>
