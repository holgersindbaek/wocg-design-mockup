<!DOCTYPE html>
<html lang="en">
<head>
<!-- Generated by icon-lab-parts/build.js from icon-lab-parts/table-view.html. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon lab: a Hearts table</title>
<link rel="stylesheet" href="guide-fonts.css">
<style>
  /* The table stands in a frame of 1440 by 900, the window it was captured in, ad rail and all, so its
     layout and media queries are the game's own at that size. The frame is scaled as one piece to fit
     the window, and the space it leaves stays dark. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1b; }
  #stage { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; background: #1e5b1c; }
  #stage iframe { display: block; width: 1440px; height: 900px; border: 0; }

  /* the versions, shown while the pointer is in the window's bottom right corner. The arrow keys step
     through them, and z flips between As built and the latest pick (kept in this browser). */
  #corner { position: fixed; right: 0; bottom: 0; width: 84px; height: 84px; z-index: 10; font: 14px/20px BuloRounded, Verdana, sans-serif; }
  #corner .handle { position: absolute; right: 16px; bottom: 16px; height: 28px; padding: 0 10px; border-radius: 14px; display: flex; align-items: center; white-space: nowrap;
    background: rgba(244, 238, 229, .92); box-shadow: inset 0 0 0 1px #c9c0ae, 0 2px 8px rgba(0, 0, 0, .25); color: #4e4d4c; font-size: 12px; font-weight: 700; opacity: .45; transition: opacity .15s; }
  #corner:hover .handle { opacity: 1; }
  #corner .bar { position: absolute; right: 16px; bottom: 52px; width: 268px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 3px;
    background: #e4ddd0; border-radius: 12px; box-shadow: inset 0 0 0 1px #c9c0ae, 0 6px 20px rgba(0, 0, 0, .28);
    opacity: 0; visibility: hidden; transform: translateY(6px); transition: opacity .15s, transform .15s, visibility 0s linear .15s; }
  #corner:hover .bar { opacity: 1; visibility: visible; transform: none; transition: opacity .15s, transform .15s; }
  #corner .bar button { font: inherit; border: 0; margin: 0; border-radius: 9px; padding: 5px 12px; cursor: pointer; color: #141414; background: transparent;
    white-space: nowrap; text-align: left; width: 100%; }
  #corner .bar button:hover { background: rgba(255, 255, 255, .55); }
  #corner .bar button.on { background: #fff; font-weight: 700; box-shadow: inset 0 0 0 1px #c9c0ae; }
  #corner .keys { padding: 4px 12px 3px; font-size: 12px; line-height: 16px; color: #67635c; }

  /* the label that names the version after an arrow key or z */
  #toast { position: fixed; right: 16px; bottom: 52px; z-index: 11; padding: 6px 14px; border-radius: 12px; background: #fff; color: #141414; white-space: nowrap;
    font: 700 14px/20px BuloRounded, Verdana, sans-serif; box-shadow: 0 0 0 1px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .28); pointer-events: none;
    opacity: 0; transform: translateY(6px); transition: opacity .18s, transform .18s; }
  #toast.show { opacity: 1; transform: none; }
  #toast span { font-weight: 400; color: #67635c; margin-left: 8px; }
</style>
</head>
<body>
<div id="stage"><iframe id="table" src="icon-lab-table-frame.html" title="A Hearts table" scrolling="no"></iframe></div>
<div id="corner"><div class="bar" id="bar"></div><div class="handle" id="handle"></div></div>
<div id="toast"></div>
<script>
(function () {
  'use strict';
  var VERSIONS = /*VERSIONS*/;
  var W = 1440, H = 900;
  var ALL = [{ id: 'built', title: 'As built' }].concat(VERSIONS);
  var stage = document.getElementById('stage'), frame = document.getElementById('table');
  var bar = document.getElementById('bar'), handle = document.getElementById('handle'), toast = document.getElementById('toast');
  var PICK = 'wocgIconLabTablePick';
  var current = 'built', said = null, toastTimer = null, pick = null;

  function indexOf(id) { for (var i = 0; i < ALL.length; i++) if (ALL[i].id === id) return i; return -1; }
  try { pick = localStorage.getItem(PICK); } catch (e) {}
  if (indexOf(pick) < 1) pick = null;

  function fit() {
    var s = Math.min(window.innerWidth / W, window.innerHeight / H);
    stage.style.transform = 'translate(' + Math.round((window.innerWidth - W * s) / 2) + 'px,' + Math.round((window.innerHeight - H * s) / 2) + 'px) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  ALL.forEach(function (v) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = v.title; b.setAttribute('data-v', v.id);
    b.addEventListener('click', function () { location.hash = 'v=' + v.id; });
    bar.appendChild(b);
  });
  var keys = document.createElement('div'); keys.className = 'keys'; keys.textContent = 'Or step with the left and right arrow keys. Press z to flip between As built and your latest pick.';
  bar.appendChild(keys);

  function send() {
    try { frame.contentWindow.postMessage({ iconlab: true, id: current }, '*'); } catch (e) {}
  }
  function show() {
    [].slice.call(bar.querySelectorAll('button')).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === current); });
    handle.textContent = 'Version ' + (indexOf(current) + 1) + ' of ' + ALL.length;
  }
  function title(id) { return ALL[indexOf(id)].title; }
  function announce(note) {
    var i = indexOf(current);
    toast.innerHTML = '';
    toast.appendChild(document.createTextNode(ALL[i].title));
    var n = document.createElement('span'); n.textContent = note || (i + 1) + ' of ' + ALL.length; toast.appendChild(n);
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1400);
  }
  function fromHash() {
    var m = /v=([\w-]+)/.exec(location.hash);
    current = m && indexOf(m[1]) >= 0 ? m[1] : 'built';
    if (current !== 'built') { pick = current; try { localStorage.setItem(PICK, pick); } catch (e) {} }
    show(); send();
    if (said === 'step') announce();
    if (said === 'flip') announce('press z for ' + (current === 'built' ? title(pick) : 'As built'));
    said = null;
  }
  function step(d) {
    said = 'step';
    location.hash = 'v=' + ALL[(indexOf(current) + d + ALL.length) % ALL.length].id;
  }
  /* z: from a version to As built, and from As built back to the latest pick (the newest version if
     there is none yet) */
  function flip() {
    said = 'flip';
    location.hash = 'v=' + (current === 'built' ? pick || ALL[ALL.length - 1].id : 'built');
  }
  window.addEventListener('hashchange', fromHash);
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d) return;
    if (d.iconlabReady) send();
    if (d.iconlabStep) step(d.iconlabStep);
    if (d.iconlabFlip) flip();
  });
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if ((e.key === 'z' || e.key === 'Z') && !e.repeat) { e.preventDefault(); flip(); return; }
    var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!d) return;
    e.preventDefault();
    step(d);
  });
  fromHash();
})();
</script>
</body>
</html>
