<!DOCTYPE html><meta charset="utf-8"><title>which second card</title>
<style>
 body{margin:0;background:#F8F9FA;font:13px -apple-system,Arial;padding:18px}
 h2{font-size:14px;margin:18px 0 8px}
 .row{display:grid;grid-template-columns:repeat(7,187px);gap:10px}
 .t{width:187px;aspect-ratio:1/.86;position:relative;background:#F1EDE6;border-radius:12px}
 .c{position:absolute;top:7%;width:50%;aspect-ratio:318/444;border-radius:12px;
    background:#fff center/100% 100% no-repeat;box-shadow:inset 0 0 0 1px #252525,0 2px 5px rgba(0,0,0,.26)}
 .b{left:6%;z-index:0;transform:rotate(-9deg)} .f{right:6%;z-index:1;transform:rotate(7deg)}
 .lab{font-size:10px;text-align:center;color:#868E96;margin-top:3px}
</style>
<div id="o"></div>
<script>
var DECKS=["classic","anglo","egypt","ornamental","tango","torres","ninaste"];
var OPTS=[["back","the back, as now"],["1s","ace of spades"],["10s","ten of spades"],["10d","ten of diamonds"]];
document.getElementById("o").innerHTML=OPTS.map(function(o){
 return "<h2>"+o[1]+"</h2><div class=row>"+DECKS.map(function(d){
  return '<div><div class="t"><i class="c b" style="background-image:url(deck-lab-assets/'+d+'/'+o[0]+'.png)"></i>'+
         '<i class="c f" style="background-image:url(deck-lab-assets/'+d+'/13h.png)"></i></div><div class="lab">'+d+'</div></div>';
 }).join("")+"</div>";
}).join("");
</script>
