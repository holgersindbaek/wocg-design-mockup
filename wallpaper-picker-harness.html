<!DOCTYPE html><meta charset="utf-8"><title>Wallpapers on the site &middot; click one to copy its name</title>
<!-- Every wallpaper the site now offers, drawn from shared/C.js with the picker’s own thumbnails.
     Click a tile and its name goes to the clipboard with a newline, so pasting several stacks them.
     The running list at the bottom right copies the lot in one go. -->
<style>
 :root{--ink:#212529;--ink-label:#868E96;--line:#DEE2E6}
 *{box-sizing:border-box}
 body{margin:0;background:#F8F9FA;font:14px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
 .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 120px}
 h1{font-size:19px;margin:0 0 2px} .sub{color:var(--ink-label);margin:0 0 24px}
 h2{font-size:14px;margin:26px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line);color:#495057}
 h2 em{color:#adb5bd;font-style:normal;font-weight:400}
 .pk{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
 .t{margin:0;cursor:pointer}
 .t span{display:block;aspect-ratio:1;border-radius:14px;background-size:cover;background-position:center;
         box-shadow:0 0 0 1px rgba(0,0,0,.18);transition:transform 80ms ease-out}
 .t:hover span{transform:scale(1.03)}
 .t.on span{box-shadow:0 0 0 3px #2B8A3E}
 .t figcaption{font-size:11px;line-height:1.3;margin-top:5px;text-align:center}
 .t i{display:block;color:#adb5bd;font-style:normal;font-size:10px}
 .bar{position:fixed;right:16px;bottom:16px;width:300px;max-height:60vh;display:flex;flex-direction:column;gap:8px;
      background:rgba(255,255,255,.96);border-radius:12px;padding:12px;box-shadow:0 2px 14px rgba(0,0,0,.3)}
 .bar h3{margin:0;font-size:13px} .bar h3 b{color:#2B8A3E}
 .bar textarea{flex:1;min-height:120px;font:12px/1.5 ui-monospace,Menlo,monospace;padding:8px;border:1px solid #ddd;border-radius:8px;resize:none}
 .bar .row{display:flex;gap:6px} .bar button{font:inherit;font-size:12px;font-weight:600;padding:6px 10px;border:0;border-radius:7px;background:#1665AD;color:#fff;cursor:pointer}
 .bar button.ghost{background:#eee;color:#333}
 .flash{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#2B8A3E;color:#fff;padding:7px 14px;
        border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .15s ease;pointer-events:none}
 .flash.on{opacity:1}
</style>

<div class="flash" id="flash"></div>
<div class="bar"><h3>To remove: <b id="n">0</b></h3><textarea id="out" spellcheck="false"></textarea>
<div class="row"><button id="all">Copy all</button><button class="ghost" id="clear">Clear</button></div></div>
<script>
var picked = [];
function flash(t){var f=document.getElementById("flash");f.textContent=t;f.classList.add("on");clearTimeout(f._t);f._t=setTimeout(function(){f.classList.remove("on");},900);}
function copy(text){
  if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function(){fallback(text);});
  else fallback(text);
}
function fallback(text){var a=document.createElement("textarea");a.value=text;document.body.appendChild(a);a.select();try{document.execCommand("copy");}catch(e){}a.remove();}
function paint(){
  document.getElementById("n").textContent = picked.length;
  document.getElementById("out").value = picked.join("\n") + (picked.length ? "\n" : "");
}
document.querySelectorAll(".t").forEach(function(t){
  t.addEventListener("click", function(){
    var name = t.getAttribute("data-name");
    var i = picked.indexOf(name);
    if (i >= 0) { picked.splice(i,1); t.classList.remove("on"); flash("took " + name + " off"); }
    else { picked.push(name); t.classList.add("on"); copy(name + "\n"); flash("copied " + name); }
    paint();
  });
});
document.getElementById("all").addEventListener("click", function(){ copy(picked.join("\n") + (picked.length?"\n":"")); flash("copied all " + picked.length); });
document.getElementById("clear").addEventListener("click", function(){ picked=[]; document.querySelectorAll(".t.on").forEach(function(t){t.classList.remove("on");}); paint(); });
paint();
</script>
